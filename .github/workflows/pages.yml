# Compila la PWA (app/) y la publica en GitHub Pages en cada push a main.
# Requiere: Settings -> Pages -> Source = "GitHub Actions".
name: Publicar app en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      BASE_PATH: /GUVA/
      # Valores públicos por diseño (van dentro del JS que descarga el navegador).
      # La seguridad real está en RLS. La service_role NUNCA va aquí.
      VITE_SUPABASE_URL: https://hqyndlnyylawjwgtqzpw.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_jOkBrFSiOS0HlH7oC1LRVQ_o4M5SWl5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # GitHub Pages no conoce las rutas de React: 404.html = index.html permite recargar /GUVA/ruta, etc.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
